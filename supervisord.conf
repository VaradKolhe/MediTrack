# ==========================================
# 1. Main Supervisor Manager
# ==========================================
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# ==========================================
# 2. Database (MySQL)
# ==========================================
[program:mysql]
command=/usr/bin/mysqld_safe
autostart=true
autorestart=true
# Forward logs to Docker so you can see them in your terminal
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ==========================================
# 3. Backend: Eureka Server (Port 8761)
# ==========================================
[program:eureka]
# We use 'bash -c' to allow the *.jar wildcard to work
command=bash -c "java -jar /app/Backend/EurekaServer/target/*.jar"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ==========================================
# 4. Backend: Admin Service
# ==========================================
[program:admin]
# Assumes folder is named 'adminservice' (lowercase) based on your list
command=bash -c "java -jar /app/Backend/adminservice/target/*.jar"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ==========================================
# 5. Backend: User Service
# ==========================================
[program:user]
# Assumes folder is named 'userservice'
command=bash -c "java -jar /app/Backend/userservice/target/*.jar"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ==========================================
# 6. Backend: Hospital Service
# ==========================================
[program:hospital]
# Assumes folder is named 'hospitalservice'
command=bash -c "java -jar /app/Backend/hospitalservice/target/*.jar"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ==========================================
# 7. Frontend: React/Vite (Port 5173)
# ==========================================
[program:frontend]
# Runs the production preview on port 5173, accessible from outside
command=npm run preview -- --host 0.0.0.0 --port 5173
directory=/app/Frontend/meditrack-frontend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
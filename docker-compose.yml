services:
  db:
    build: ./Database
    container_name: meditrack-db
    restart: unless-stopped
    networks:
      - meditrack-net
    ports:
      - "3307:3306"
    volumes:
      - meditrack_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: MediTrackDB

  backend-image:
    build: ./Backend
    container_name: meditrack-backend
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - meditrack-net
    ports:
      - "8761:8761"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/MediTrackDB

  frontend-image:
    build: ./Frontend/meditrack-frontend
    container_name: meditrack-frontend
    restart: unless-stopped
    depends_on:
      - backend-image
    networks:
      - meditrack-net
    ports:
      - "5173:5173"

networks:
  meditrack-net:
    driver: bridge

volumes:
  meditrack_data:
    name: meditrack_data
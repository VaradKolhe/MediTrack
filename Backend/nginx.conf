server {
    listen 80;

    # --- Hospital Service (Port 8081) ---
    # Frontend sends: /svc/hospital/rooms
    # Nginx forwards: http://127.0.0.1:8081/rooms
    location /svc/hospital/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- User Service (Port 8082) ---
    # Frontend sends: /svc/user/api/auth/login
    # Nginx forwards: http://127.0.0.1:8082/api/auth/login
    location /svc/user/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Admin Service (Port 8083) ---
    # Frontend sends: /svc/admin/admin/hospitals
    # Nginx forwards: http://127.0.0.1:8083/admin/hospitals
    location /svc/admin/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Optional: Health check endpoint for Render
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
server {
    listen 80;
    
    # Safety: Allow uploads up to 10MB (for reports/profile pics)
    client_max_body_size 10M;

    # Safety: Increase timeout for slow Free Tier wake-ups
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ----------------------------------------------------
    # 1. HOSPITAL SERVICE (Port 8081)
    # ----------------------------------------------------
    # Frontend: /svc/hospital/rooms
    # Backend:  localhost:8081/rooms
    location /svc/hospital/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------
    # 2. USER SERVICE (Port 8082)
    # ----------------------------------------------------
    # Frontend: /svc/user/api/auth/login
    # Backend:  localhost:8082/api/auth/login
    location /svc/user/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------
    # 3. ADMIN SERVICE (Port 8083)
    # ----------------------------------------------------
    # Frontend: /svc/admin/admin/hospitals
    # Backend:  localhost:8083/admin/hospitals
    location /svc/admin/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------
    # 5. HEALTH CHECK (For Render)
    # ----------------------------------------------------
    # Render hits this to verify the container is alive
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    # Default Root (Catch-all)
    location / {
        return 200 'MediTrack API Gateway is Running';
        add_header Content-Type text/plain;
    }
}